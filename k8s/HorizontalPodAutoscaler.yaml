apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: esme-app-hpa
  namespace: esme-tp-diascosta
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: esme-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
